<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxketch · 재무 콕핏</title>
<style>
:root{
  --bg:#0e1320; --bg2:#121829; --panel:#171d30; --panel2:#1d2540; --raise:#232c4a;
  --line:#2a3350; --line2:#36416a; --ink:#e9edf8; --ink2:#c2c9dd; --mut:#8089a3; --mut2:#646d88;
  --orange:#f0823c; --orange-d:#c9652a; --green:#48c08a; --green-d:#2f8a62;
  --red:#e35d5b; --red-d:#b13f3d; --blue:#5e92d8; --yellow:#e7b54e;
  --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,"Roboto Mono",monospace;
  --sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#16203a 0%,var(--bg) 55%)}
a{color:var(--blue);text-decoration:none}
::selection{background:rgba(240,130,60,.3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--green)} .neg{color:var(--red)} .warnc{color:var(--orange)} .mut{color:var(--mut)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header.app{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1c2643,#0f1426);border:1px solid var(--line2);
  display:grid;place-items:center;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.logo:before{content:"";position:absolute;inset:7px;border-radius:3px;
  background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.07) 4px 5px),
             repeating-linear-gradient(90deg,transparent 0 4px,rgba(255,255,255,.07) 4px 5px)}
.logo span{position:relative;width:3px;height:15px;background:var(--orange);border-radius:2px;transform:rotate(32deg);box-shadow:0 0 8px rgba(240,130,60,.7)}
.brand h1{font-size:15px;margin:0;letter-spacing:.2px;font-weight:700}
.brand .sub{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
  padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);color:var(--ink);background:var(--panel2)}
.btn.accent{background:linear-gradient(180deg,#f0823c,#d96e2e);border-color:#e0763300;color:#1a1206;font-weight:700}
.btn.accent:hover{filter:brightness(1.07)}
.btn.danger:hover{border-color:var(--red-d);color:#ffb4b3}
.save-dot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.save-dot i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green-d)}
.save-dot.dirty i{background:var(--yellow);box-shadow:0 0 7px #8a6a1f}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:8px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;overflow:hidden}
.kpi .lab{font-size:11px;color:var(--mut);letter-spacing:.02em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.kpi .delta{font-size:11px;margin-top:6px;font-family:var(--mono)}
.kpi.span2{grid-column:span 2}
.kpi.runway{background:linear-gradient(180deg,#1b1322,#120e1c);border-color:#3a2a3f}
.fuel{height:9px;border-radius:6px;background:#2a2030;margin-top:10px;overflow:hidden;border:1px solid #382a3e}
.fuel>i{display:block;height:100%;border-radius:6px;transition:width .4s,background .3s}
.fuel-ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut2);margin-top:4px;font-family:var(--mono)}
.state-ok{color:var(--green)} .state-warn{color:var(--orange)} .state-crit{color:var(--red)}

/* tabs */
nav.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{font-size:13.5px;color:var(--mut);background:none;border:none;padding:10px 14px 11px;cursor:pointer;border-bottom:2px solid transparent;border-radius:0;font-family:var(--sans)}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--orange);border-bottom-color:var(--orange);font-weight:600}
.panewrap>section{display:none}
.panewrap>section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

/* cards & charts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:13px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:13px}
.card h3{margin:0 0 3px;font-size:13.5px;font-weight:700}
.card .ch-sub{font-size:11px;color:var(--mut);margin:0 0 11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.insight{font-size:13px;line-height:1.75;color:var(--ink2)}
.insight b{color:var(--ink)}
.insight .row{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:9px}
.insight .row:last-child{border-bottom:none}
.insight .ic{flex:none;width:20px;text-align:center}
svg{display:block;width:100%;height:auto;overflow:visible}

/* tables */
.scrollx{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--bg2)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;min-width:760px}
table.grid th,table.grid td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.grid thead th{position:sticky;top:0;background:#141a2c;color:var(--mut);font-weight:600;font-size:11px;z-index:3;border-bottom:1px solid var(--line2)}
table.grid th.lft,table.grid td.lft{text-align:left}
table.grid td.mth,table.grid th.mth{position:sticky;left:0;background:var(--bg2);text-align:left;z-index:2;border-right:1px solid var(--line)}
table.grid thead th.mth{z-index:4;background:#141a2c}
table.grid tbody tr:hover td{background:rgba(94,146,216,.06)}
table.grid tbody tr:hover td.mth{background:#1a2236}
.grp-rev{color:#7fb0e8} .grp-exp{color:#e79a9a} 
th.sep,td.sep{border-left:1px solid var(--line2)}

input.cell{width:88px;font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink);
  background:#0e1424;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-variant-numeric:tabular-nums}
input.cell::placeholder{color:#4a5474;font-style:normal}
input.cell:focus{outline:none;border-color:var(--orange);background:#161021;box-shadow:0 0 0 2px rgba(240,130,60,.18)}
input.cell.exp:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(227,93,91,.16)}
td.calc{font-family:var(--mono);background:rgba(255,255,255,.015)}
td.closing{font-family:var(--mono);font-weight:600}
tr.tot td{border-top:1px solid var(--line2);background:#12182a;font-weight:600;font-family:var(--mono)}
tr.tot td.mth{background:#12182a}
.phase{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--raise);color:var(--ink2);font-family:var(--mono)}
.mini{font-size:10px;color:var(--mut2);font-family:var(--mono)}
.linkbtn{font-size:10.5px;color:var(--blue);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
.linkbtn:hover{border-color:var(--blue);color:#9cc1ee}

/* segmented control */
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{font-family:var(--sans);font-size:12px;color:var(--mut);background:none;border:none;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--raise);color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:11.5px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:0 8px 8px 0;padding:8px 12px;margin:10px 0}
.tag{font-size:9.5px;font-family:var(--mono);color:var(--green);border:1px solid var(--green-d);border-radius:5px;padding:0 5px;margin-left:6px}

/* assumptions */
.asgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ascat{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.ascat h4{margin:0 0 9px;font-size:12px;color:var(--orange);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.asrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line)}
.asrow:last-child{border-bottom:none}
.asrow .k{flex:1;font-size:12px}
.asrow .k .n{display:block;font-size:10px;color:var(--mut2);margin-top:1px}
.asrow input{width:120px;font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink);background:#0e1424;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.asrow input:focus{outline:none;border-color:var(--orange)}
.asrow input:disabled{opacity:.5;cursor:not-allowed}
.asrow .u{font-size:10.5px;color:var(--mut);width:40px;font-family:var(--mono)}
.footer{margin-top:26px;font-size:11px;color:var(--mut2);text-align:center;line-height:1.8}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#15203a;border:1px solid var(--line2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:920px){
  .kpis{grid-template-columns:repeat(2,1fr)} .kpi.span2{grid-column:span 2}
  .grid2,.grid3,.asgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.auth-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.auth-bar input{width:150px;font-size:12px;padding:6px 8px;background:#0e1424;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.auth-bar .btn{margin:0}
.auth-user{font-size:11.5px;color:var(--green);font-family:var(--mono)}
.auth-status{font-size:11.5px;font-family:var(--mono);min-width:120px;flex:1}
.auth-status.err{color:var(--red)}
.auth-status.ok{color:var(--green)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="auth-bar" id="authBar">
    <input id="authEmail" type="email" placeholder="이메일" autocomplete="username">
    <input id="authPass" type="password" placeholder="비밀번호 (6자+)" autocomplete="current-password">
    <button class="btn accent" type="button" id="btnAuthLogin">로그인</button>
    <button class="btn" type="button" id="btnAuthSignup">가입</button>
    <span id="authStatus" class="auth-status"></span>
    <span id="authUser" class="auth-user hidden"></span>
    <button class="btn hidden" type="button" id="btnAuthLogout">로그아웃</button>
  </div>
  <header class="app">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div>
        <h1>Fluxketch 재무 콕핏</h1>
        <div class="sub">Runway · Plan vs Actual · Channels</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <span class="save-dot" id="saveDot"><i></i>저장됨</span>
      <button class="btn" id="btnExportJson">상태 저장(JSON)</button>
      <button class="btn" id="btnImportJson">불러오기</button>
      <button class="btn" id="btnExportCsv">CSV 내보내기</button>
      <button class="btn danger" id="btnReset">계획으로 초기화</button>
      <input type="file" id="fileJson" accept="application/json" style="display:none">
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-t="dash">대시보드</button>
    <button class="tab" data-t="cash">월별 현금흐름</button>
    <button class="tab" data-t="chan">채널별 매출</button>
    <button class="tab" data-t="assum">가정</button>
  </nav>

  <div class="panewrap">
    <section class="on" id="pane-dash"></section>
    <section id="pane-cash"></section>
    <section id="pane-chan"></section>
    <section id="pane-assum"></section>
  </div>

  <div class="footer">
    Fluxketch 재무 콕핏 · 실제값을 입력하면 런웨이·손익분기·채널 성과가 자동 계산됩니다.<br>
    <b>로그인</b>하면 Supabase 클라우드에 자동 저장됩니다 (사지방 PC 초기화 OK). JSON/CSV 내보내기도 가능.
  </div>
</div>
<div class="toast" id="toast"></div>

/* ---------------- helpers ---------------- */
const A=k=>{const v=parseFloat(S.assumptions[k]?.value); return isNaN(v)?0:v;};
const netRate=()=>{let r=A("apple_net_rate"); return (r>0&&r<=1)?r:0.85;};
function pnum(v){ if(v===null||v===undefined) return null; const s=(""+v).replace(/[^0-9.\-]/g,""); if(s===""||s==="-") return null; const n=parseFloat(s); return isNaN(n)?null:n; }
function actHas(m){ return REVK.some(k=>pnum(m.actual[k])!==null) || EXPK.some(k=>pnum(m.actual[k])!==null); }
const sumKeys=(o,keys)=>keys.reduce((s,k)=>s+(pnum(o[k])||0),0);
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return "—"; const r=Math.round(n); return (r<0?"-":"")+"₩"+Math.abs(r).toLocaleString("ko-KR"); }
function fmtP(n){ return (n===null||isNaN(n))?"—":Math.round(n).toLocaleString("ko-KR"); }
function abbr(n){ if(n===null||isNaN(n)) return "—"; const s=n<0?"-":""; n=Math.abs(n);
  if(n>=1e8) return s+"₩"+(n/1e8).toFixed(n>=1e9?0:2).replace(/\.?0+$/,"")+"억";
  if(n>=1e4) return s+"₩"+Math.round(n/1e4).toLocaleString("ko-KR")+"만";
  return s+"₩"+Math.round(n).toLocaleString("ko-KR"); }
const mlabel=m=>m.slice(2).replace("-","."); // 2026-11 -> 26.11

/* ---------------- compute ---------------- */
let C=null;
function compute(){
  const nr=netRate(), gr=1-nr, start=A("starting_cash");
  let planClose=start, mixPrev=start, lastActIdx=-1, cumNet=0;
  const rows=S.months.map((m,i)=>{
    const has=actHas(m);
    if(has) lastActIdx=i;
    // plan authoritative
    const p=m.plan;
    const planGross=p.gross, planNet=p.net, planExp=p.exp_total, planNcf=p.net_cf, planClosing=p.closing;
    // actual / forecast
    let aGross,aFee,aNet,aExp,aInj,aNcf,activeP;
    if(has){
      aGross=sumKeys(m.actual,REVK); aFee=Math.round(aGross*gr); aNet=aGross-aFee;
      aExp=sumKeys(m.actual,EXPK); aInj=pnum(m.actual.injection)||0; aNcf=aNet+aInj-aExp;
      activeP=(pnum(m.actual.active_paid)!==null)?pnum(m.actual.active_paid):p.active_paid;
    }else{ aGross=p.gross; aFee=p.fee; aNet=p.net; aExp=p.exp_total; aInj=0; aNcf=p.net_cf; activeP=p.active_paid; }
    const mixClosing=mixPrev+aNcf; const mixOpening=mixPrev; mixPrev=mixClosing;
    cumNet+=aNet;
    return {i,month:m.month,phase:m.phase,event:m.event,has,
      planGross,planNet,planExp,planNcf,planClosing,planActive:p.active_paid,
      aGross,aFee,aNet,aExp,aInj,aNcf,mixOpening,mixClosing,activeP,cumNet};
  });
  // current month = last actualized, else -1 (start)
  const curIdx=lastActIdx;
  const curCash=curIdx<0?start:rows[curIdx].mixClosing;
  // runway: walk projected mix closing forward from curIdx
  let lowest=Infinity, lowIdx=-1, runout=-1;
  for(let j=curIdx+1;j<rows.length;j++){ if(rows[j].mixClosing<lowest){lowest=rows[j].mixClosing;lowIdx=j;} if(runout<0&&rows[j].mixClosing<0) runout=j; }
  let runwayMonths, runwaySafe=false;
  if(runout>=0){ runwayMonths=runout-curIdx; }
  else { runwaySafe=true; runwayMonths=rows.length-1-curIdx; }
  C={rows,start,curIdx,curCash,lowest:isFinite(lowest)?lowest:curCash,lowMonth:lowIdx>=0?rows[lowIdx].month:null,
     runwayMonths,runwaySafe,nr,gr};
  return C;
}

/* ---------------- SVG charts ---------------- */
const NS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}
function chartLine(series,labels,opt){
  opt=opt||{}; const W=opt.w||640,H=opt.h||230,pl=44,pr=12,pt=14,pb=26;
  const all=series.flatMap(s=>s.pts).filter(v=>v!=null);
  let mn=Math.min(0,...all), mx=Math.max(...all,1); if(mx===mn)mx=mn+1;
  const x=i=>pl+(W-pl-pr)*(labels.length<2?0:i/(labels.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  // gridlines
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,yy=y(v);
    svg.appendChild(svgEl("line",{x1:pl,y1:yy,x2:W-pr,y2:yy,stroke:"#23304f","stroke-width":1}));
    svg.appendChild(svgEl("text",{x:pl-6,y:yy+3,"text-anchor":"end",fill:"#646d88","font-size":9,"font-family":"var(--mono)"},abbr(v)));
  }
  if(mn<0){const yy=y(0);svg.appendChild(svgEl("line",{x1:pl,y1:yy,x2:W-pr,y2:yy,stroke:"#e35d5b","stroke-width":1,"stroke-dasharray":"4 3",opacity:.6}));}
  // x labels (sparse)
  const step=Math.ceil(labels.length/8);
  labels.forEach((l,i)=>{ if(i%step===0||i===labels.length-1) svg.appendChild(svgEl("text",{x:x(i),y:H-8,"text-anchor":"middle",fill:"#646d88","font-size":9,"font-family":"var(--mono)"},l)); });
  series.forEach(s=>{
    let d="",started=false;
    s.pts.forEach((v,i)=>{ if(v==null){return;} d+=(started?"L":"M")+x(i)+" "+y(v)+" "; started=true; });
    if(s.fill){ const area=d+`L ${x(s.pts.length-1)} ${y(0)} L ${x(0)} ${y(0)} Z`;
      const grad="g"+Math.random().toString(36).slice(2,7);
      const lg=svgEl("linearGradient",{id:grad,x1:0,y1:0,x2:0,y2:1});
      lg.appendChild(svgEl("stop",{offset:"0%","stop-color":s.color,"stop-opacity":.28}));
      lg.appendChild(svgEl("stop",{offset:"100%","stop-color":s.color,"stop-opacity":0}));
      const defs=svgEl("defs",{}); defs.appendChild(lg); svg.appendChild(defs);
      svg.appendChild(svgEl("path",{d:area,fill:`url(#${grad})`,stroke:"none"}));
    }
    svg.appendChild(svgEl("path",{d,fill:"none",stroke:s.color,"stroke-width":s.width||2,"stroke-dasharray":s.dash||"","stroke-linejoin":"round"}));
    if(opt.markIdx!=null&&s.pts[opt.markIdx]!=null) svg.appendChild(svgEl("circle",{cx:x(opt.markIdx),cy:y(s.pts[opt.markIdx]),r:3.5,fill:s.color,stroke:"#0e1320","stroke-width":1.5}));
  });
  return svg;
}
function chartGroupBars(labels,groups,opt){
  opt=opt||{}; const W=opt.w||640,H=opt.h||230,pl=44,pr=10,pt=12,pb=26;
  const mx=Math.max(1,...groups.flatMap(g=>g.vals.filter(v=>v!=null)));
  const n=labels.length, bw=(W-pl-pr)/n, gw=bw*0.62, sub=gw/groups.length;
  const y=v=>pt+(H-pt-pb)*(1-v/mx);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  for(let g=0;g<=4;g++){const v=mx*g/4,yy=y(v);
    svg.appendChild(svgEl("line",{x1:pl,y1:yy,x2:W-pr,y2:yy,stroke:"#23304f"}));
    svg.appendChild(svgEl("text",{x:pl-6,y:yy+3,"text-anchor":"end",fill:"#646d88","font-size":9,"font-family":"var(--mono)"},abbr(v)));}
  labels.forEach((l,i)=>{
    const x0=pl+bw*i+(bw-gw)/2;
    groups.forEach((grp,gi)=>{ const v=grp.vals[i]; if(v==null||v<=0)return; const h=(H-pt-pb)*v/mx;
      svg.appendChild(svgEl("rect",{x:x0+sub*gi+1,y:H-pb-h,width:sub-2,height:h,rx:2,fill:grp.color,opacity:grp.op||1})); });
    const step=Math.ceil(n/9);
    if(i%step===0||i===n-1) svg.appendChild(svgEl("text",{x:pl+bw*i+bw/2,y:H-8,"text-anchor":"middle",fill:"#646d88","font-size":9,"font-family":"var(--mono)"},l));
  });
  return svg;
}
function chartHBars(rows,opt){
  opt=opt||{}; const W=opt.w||640, rh=opt.rh||26, lblW=opt.lblW||92, pr=58, pt=6;
  const H=pt*2+rows.length*rh;
  const mx=Math.max(1,...rows.flatMap(r=>r.vals.map(v=>v.val)));
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  rows.forEach((r,i)=>{
    const y0=pt+i*rh; const bh=(rh-8)/r.vals.length;
    svg.appendChild(svgEl("text",{x:lblW-8,y:y0+rh/2+3,"text-anchor":"end",fill:"#c2c9dd","font-size":11},r.label));
    r.vals.forEach((v,vi)=>{ const w=(W-lblW-pr)*v.val/mx;
      svg.appendChild(svgEl("rect",{x:lblW,y:y0+4+bh*vi,width:Math.max(0,w),height:bh-1.5,rx:2,fill:v.color}));
      if(vi===r.vals.length-1) svg.appendChild(svgEl("text",{x:lblW+Math.max(0,w)+6,y:y0+rh/2+3,fill:"#8089a3","font-size":10,"font-family":"var(--mono)"},abbr(r.tot!=null?r.tot:v.val)));
    });
  });
  return svg;
}
function chartDonut(segs,opt){
  opt=opt||{}; const sz=opt.sz||168, r=sz/2-6, ir=r*0.6, cx=sz/2, cy=sz/2;
  const tot=segs.reduce((s,x)=>s+x.val,0)||1; let a=-Math.PI/2;
  const svg=svgEl("svg",{viewBox:`0 0 ${sz} ${sz}`,style:"max-width:"+sz+"px;margin:0 auto"});
  segs.forEach(s=>{ const ang=2*Math.PI*s.val/tot, a2=a+ang;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi1=cx+ir*Math.cos(a2),yi1=cy+ir*Math.sin(a2),xi2=cx+ir*Math.cos(a),yi2=cy+ir*Math.sin(a);
    const large=ang>Math.PI?1:0;
    if(s.val>0) svg.appendChild(svgEl("path",{d:`M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${xi1} ${yi1} A${ir} ${ir} 0 ${large} 0 ${xi2} ${yi2} Z`,fill:s.color}));
    a=a2; });
  svg.appendChild(svgEl("text",{x:cx,y:cy-2,"text-anchor":"middle",fill:"#8089a3","font-size":10},"총비용"));
  svg.appendChild(svgEl("text",{x:cx,y:cy+13,"text-anchor":"middle",fill:"#e9edf8","font-size":12,"font-family":"var(--mono)"},abbr(tot)));
  return svg;
}

function renderKPI(){

    rwState = C.runwayMonths<=critM?"state-crit":(C.runwayMonths<=warnM?"state-warn":"state-ok"); }
  const fuel=Math.max(0,Math.min(1,C.curCash/C.start));

    <i style="width:10px;height:10px;border-radius:3px;background:${s.color};flex:none"></i>
    <span style="flex:1;color:var(--ink2)">${s.label}</span>

    const actSum=list.reduce((s,c)=>s+(pnum(c.actual.revenue)||0),0);

function renderInsight(){
  const r=C.rows, cur=C.curIdx, box=document.getElementById("insight"); if(!box) return;
  const out=[];
  if(cur<0){
    out.push(["📋","아직 <b>실제값 입력 전</b>입니다. <b>월별 현금흐름</b> 탭에서 매출·비용을 입력하면 런웨이와 손익분기가 실제 기준으로 갱신됩니다. 빈 칸의 회색 숫자는 계획값입니다."]);
    out.push(["💰",`시작 자본 <b>${abbr(C.start)}</b> · 계획상 11월 출시까지 약 <b>${abbr(C.start - r[5].mixClosing)}</b> 소진 예정.`]);
  }else{
    const cr=r[cur], dCash=cr.mixClosing-cr.planClosing, dGross=cr.aGross-cr.planGross;
    out.push(["📍",`기준월 <b>${cr.month}</b> · 잔고 <b>${abbr(cr.mixClosing)}</b> (계획 대비 <b class="${dCash>=0?'pos':'neg'}">${dCash>=0?'+':''}${abbr(dCash)}</b>).`]);
    out.push([C.runwaySafe?"🟢":(C.runwayMonths<=(A("runway_critical_months")||2)?"🔴":"🟠"),
      C.runwaySafe?`현재 추세로는 데이터 기간 내 <b>현금 고갈이 없습니다</b>. 최저 예상 잔고 <b>${abbr(C.lowest)}</b> (${C.lowMonth}).`
      :`런웨이 <b>${C.runwayMonths}개월</b> — 예상 고갈 <b>${r[cur+C.runwayMonths]?r[cur+C.runwayMonths].month:'—'}</b>. 최저 잔고 ${abbr(C.lowest)}.`]);
    const bep=A("bep_gross_mrr"); const pct=bep>0?Math.round(cr.aGross/bep*100):0;
    out.push([pct>=100?"✅":"📈",`이번 달 총매출 <b>${abbr(cr.aGross)}</b> = 손익분기(${abbr(bep)})의 <b>${pct}%</b> ${pct>=100?'— 달성':'— 미달'}. 매출 ${dGross>=0?'계획 초과':'계획 미달'} <b class="${dGross>=0?'pos':'neg'}">${dGross>=0?'+':''}${abbr(dGross)}</b>.`]);
  }
  // best channel (actual if any else plan)
  const chans=[...new Set(S.channels.map(c=>c.channel))];
  let best=null;
  chans.forEach(ch=>{const list=S.channels.filter(c=>c.channel===ch);
    const anyAct=list.some(c=>pnum(c.actual.revenue)!==null);
    const sum=list.reduce((s,c)=>s+(anyAct?(pnum(c.actual.revenue)||0):(c.plan.revenue||0)),0);
    if(!best||sum>best.sum) best={ch,sum,anyAct};});
  if(best&&best.sum>0) out.push(["🏆",`최대 매출 채널: <b>${CH_LABEL[best.ch]||best.ch}</b> (${best.anyAct?'실제':'계획'} 누적 <b>${abbr(best.sum)}</b>).`]);
  box.innerHTML=out.map(o=>`<div class="row"><span class="ic">${o[0]}</span><span>${o[1]}</span></div>`).join("");
}

function updateChanComputed(){
  const months=[...new Set(S.channels.map(c=>c.month))];
  const chans=[...new Set(S.channels.map(c=>c.channel))];
  const mk=ui.chanMetric, isRev=mk==="revenue";
  const ctot={}, fmtv=v=>isRev?abbr(v):fmtP(v);
  chans.forEach(c=>ctot[c]=0); let all=0;
  months.forEach(mo=>{ let rt=0;
    chans.forEach(c=>{const row=S.channels.find(x=>x.month===mo&&x.channel===c);
      const v=(pnum(row.actual[mk])!==null)?pnum(row.actual[mk]):row.plan[mk]; rt+=v; ctot[c]+=v;});
    const el=document.getElementById("rt-"+mo); if(el)el.textContent=fmtv(rt); all+=rt; });
  chans.forEach(c=>{const el=document.getElementById("ct-"+c); if(el)el.textContent=fmtv(ctot[c]);});
  const ea=document.getElementById("ct-all"); if(ea)ea.textContent=fmtv(all);
  // bar
  const cont=document.getElementById("ch-chanbar"); if(cont){ cont.innerHTML="";
    const rows=chans.map(c=>{const list=S.channels.filter(x=>x.channel===c);
      const ps=list.reduce((s,x)=>s+(x.plan[mk]||0),0);
      const anyAct=list.some(x=>pnum(x.actual[mk])!==null);
      const as=list.reduce((s,x)=>s+(pnum(x.actual[mk])||0),0);
      return {label:CH_LABEL[c]||c,tot:ps,vals:[{val:ps,color:"#5e92d8"},{val:anyAct?as:0,color:"#f0823c"}]};
    }).sort((a,b)=>b.tot-a.tot);
    cont.appendChild(chartHBars(rows,{rh:30}));
  }
}

function importJson(file){const fr=new FileReader();fr.onload=()=>{try{const sv=JSON.parse(fr.result);
  S=freshState();
  if(sv.assumptions)for(const k in sv.assumptions){if(S.assumptions[k])S.assumptions[k].value=sv.assumptions[k];}
  if(sv.months)sv.months.forEach((x,i)=>{if(S.months[i])S.months[i].actual=x||{};});
  if(sv.channels)sv.channels.forEach((x,i)=>{if(S.channels[i])S.channels[i].actual=x||{};});
  if(sv.ui)Object.assign(ui,sv.ui);
  save();recompute();switchTab(ui.tab||"dash");showToast("불러왔습니다");
}catch(e){showToast("JSON을 읽지 못했습니다");}};fr.readAsText(file);}
